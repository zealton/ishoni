# Railway reads this file from the repository root (config as code), so the service needs no "config file path"
# setting in the dashboard. It mirrors deploy/railway/railway.json; see docs/DEPLOY_RAILWAY.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/railway/Dockerfile"

[deploy]
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/v1/health"
healthcheckTimeout = 60
sleepApplication = false
